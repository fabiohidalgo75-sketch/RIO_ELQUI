services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: elquialerta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elquialerta
      POSTGRES_USER: elquialerta
      POSTGRES_PASSWORD: elquialerta_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elquialerta -d elquialerta"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elquialerta_net

  redis:
    image: redis:7-alpine
    container_name: elquialerta_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elquialerta_net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: elquialerta_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elquialerta_minio
      MINIO_ROOT_PASSWORD: elquialerta_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - elquialerta_net

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: elquialerta_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 elquialerta_minio elquialerta_minio_secret &&
        mc mb --ignore-existing local/elquialerta &&
        echo 'Bucket elquialerta listo.'
      "
    networks:
      - elquialerta_net
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  elquialerta_net:
    driver: bridge
